
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería con modales</title>
  <link rel="stylesheet" href="styles.css">


<style>


* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.galeria {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  max-width: 1100px;
  margin: 0 auto;
}

.tarjeta {
  min-width: 0;
  overflow: hidden;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 14px #00000015;
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
}

.tarjeta:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 24px #00000025;
}

.tarjeta img {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.tarjeta h3 {
  margin: 0;
  padding: 18px;
  color: #222;
  text-align: center;
}

/* Fondo del modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 20px;
  background: rgba(0, 0, 0, 0.75);
  justify-content: center;
  align-items: center;
  overflow-y: auto;
}

.modal.activo {
  display: flex;
}

/* Ventana emergente */
.modal-contenido {
  position: relative;
  width: 100%;
  max-width: 650px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  background: white;
  border-radius: 16px;
  text-align: center;
  animation: aparecer 0.25s ease;
}

.modal-contenido img {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: cover;
  border-radius: 10px;
}

.modal-contenido h2 {
  margin: 18px 0 10px;
}

.modal-contenido p {
  color: #555;
  line-height: 1.6;
}

.cerrar {
  position: absolute;
  top: 25px;
  right: 25px;
  z-index: 1;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: white;
  color: #222;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 2px 8px #00000030;
}

.modal-abierto {
  overflow: hidden;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Adaptación a tablets y celulares */
@media (max-width: 768px) {
  body {
    padding: 16px;
  }

  .galeria {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .tarjeta img {
    height: 170px;
  }
}

@media (max-width: 480px) {
  .galeria {
    grid-template-columns: 1fr;
  }

  .tarjeta img {
    height: 220px;
  }

  .modal {
    padding: 12px;
  }

  .modal-contenido {
    padding: 14px;
  }
}



</style>


</head>
<body>

  <section class="galeria">
    <div class="tarjeta" onclick="abrirModal(0)">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
           alt="Paisaje natural">
      <h3>Naturaleza</h3>
    </div>

    <div class="tarjeta" onclick="abrirModal(1)">
      <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600"
           alt="Montañas">
      <h3>Aventura</h3>
    </div>

    <div class="tarjeta" onclick="abrirModal(2)">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
           alt="Amanecer">
      <h3>Atardeceres</h3>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" id="modal" onclick="cerrarFondo(event)">
    <div class="modal-contenido">
      <button class="cerrar" onclick="cerrarModal()"
              aria-label="Cerrar modal">&times;</button>

      <img id="modal-imagen" src="" alt="">
      <h2 id="modal-titulo"></h2>
      <p id="modal-descripcion"></p>
    </div>
  </div>

  <script>
    const contenido = [
      {
        titulo: "Naturaleza",
        imagen: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200",
        descripcion: "Descubre la belleza de los paisajes naturales."
      },
      {
        titulo: "Aventura",
        imagen: "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200",
        descripcion: "Explora nuevos lugares y vive experiencias únicas."
      },
      {
        titulo: "Atardeceres",
        imagen: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1200",
        descripcion: "Disfruta de los colores y la tranquilidad del atardecer."
      }
    ];

    function abrirModal(indice) {
      const item = contenido[indice];

      document.getElementById("modal-imagen").src = item.imagen;
      document.getElementById("modal-imagen").alt = item.titulo;
      document.getElementById("modal-titulo").textContent = item.titulo;
      document.getElementById("modal-descripcion").textContent =
        item.descripcion;

      document.getElementById("modal").classList.add("activo");
      document.body.classList.add("modal-abierto");
    }

    function cerrarModal() {
      document.getElementById("modal").classList.remove("activo");
      document.body.classList.remove("modal-abierto");
    }

    function cerrarFondo(event) {
      if (event.target.id === "modal") {
        cerrarModal();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        cerrarModal();
      }
    });
  </script>

</body>
</html>
